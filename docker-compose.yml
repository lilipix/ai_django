services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ai_django_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-django_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ai_django_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Web Django
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_django_web
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Live-reloading
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - UV_NO_CACHE=true
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
      - RUFF_CACHE_DIR=/tmp/.ruff_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: