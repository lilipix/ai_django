name: Continuous Integration (Docker Native)

on:
  push:
    branches:
  pull_request:
    branches:

jobs:
  test:
    name: Build & Run Tests in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build web

      - name: Run Linter (Ruff) in Docker
        run: |
          docker compose run --rm web uv run ruff check .

      - name: Run Unit Tests in Docker
        env:
          DJANGO_SECRET_KEY: "ci-secret-key-testing"
          DJANGO_DEBUG: "True"
          POSTGRES_DB: "django_ai_db"
          POSTGRES_USER: "root"
          POSTGRES_PASSWORD: "root"
          POSTGRES_HOST: "db"
          POSTGRES_PORT: "5432"
        run: |
          docker compose run --rm web uv run python manage.py test

      - name: Clean up Docker containers
        if: always()
        run: |
          docker compose down --volumes --remove-orphans