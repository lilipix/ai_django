name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --no-dev
      - name: Lint
        run: uv run ruff check .
      - name: Créer le fichier .env pour la CI
        run: |
          {
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_HOST_PORT=${{ secrets.POSTGRES_HOST_PORT }}"
            echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}"
            echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}"
            echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}"
            echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}"
          } > .env
      - name: Construire les conteneurs
        run: docker compose build

      - name: Exécuter les tests Django dans Docker
        run: |
          docker compose run --rm \
            -e UV_CACHE_DIR=/tmp/uv-cache-ci \
            web uv run --no-sync python manage.py test -v 2

      - name: Arrêter les conteneurs
        if: always()
        run: docker compose down --volumes --remove-orphans
